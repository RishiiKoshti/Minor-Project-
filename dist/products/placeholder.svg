<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="50%" stop-color="#0f131a" />
      <stop offset="100%" stop-color="#090d14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="16" />
  <rect width="400" height="300" fill="url(#meshGrad)" rx="16" />

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="300" />
    <line x1="120" y1="0" x2="120" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="280" y1="0" x2="280" y2="300" />
    <line x1="360" y1="0" x2="360" y2="300" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>

  <!-- Tech Device Icon Silhouette -->
  <g transform="translate(200, 125)">
    <!-- Ambient Glow Circle -->
    <circle cx="0" cy="0" r="48" fill="#00f2fe" fill-opacity="0.08" filter="url(#glow)" />
    <circle cx="0" cy="0" r="40" fill="#1b2332" stroke="#2a364f" stroke-width="2" />

    <!-- Stylized Device / Circuit Icon -->
    <rect x="-20" y="-24" width="40" height="48" rx="6" fill="#111622" stroke="url(#accentGrad)" stroke-width="2.5" />
    <!-- Screen area -->
    <rect x="-15" y="-18" width="30" height="34" rx="2" fill="#1b2438" />
    <!-- Dynamic notch / camera -->
    <circle cx="0" cy="-21" r="1.5" fill="#00f2fe" />
    <!-- Home bar / indicator -->
    <line x1="-8" y1="19" x2="8" y2="19" stroke="#4facfe" stroke-width="2" stroke-linecap="round" />
    
    <!-- Orbiting Accent Sparkles -->
    <circle cx="32" cy="-26" r="3" fill="#00f2fe" opacity="0.8" />
    <circle cx="-30" cy="22" r="2" fill="#4facfe" opacity="0.7" />
  </g>

  <!-- Typography: Brand & Product Visual -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="200" y="215" fill="#f1f5f9" font-size="14" font-weight="600" letter-spacing="1">ELECTROHAVEN</text>
    <text x="200" y="235" fill="#64748b" font-size="11" font-weight="500" letter-spacing="0.5">Authentic Gear Image</text>
  </g>
</svg>
