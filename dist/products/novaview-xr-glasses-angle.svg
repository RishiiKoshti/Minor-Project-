<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_novaview_xr_glasses_angle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_novaview_xr_glasses_angle" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_novaview_xr_glasses_angle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_novaview_xr_glasses_angle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="ringGrad_novaview_xr_glasses_angle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_novaview_xr_glasses_angle)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_novaview_xr_glasses_angle)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_novaview_xr_glasses_angle)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_novaview_xr_glasses_angle)">
    
      <g transform="translate(120, 120)">
        <!-- Top Frame Browline -->
        <path d="M 20,70 Q 180,50 340,70" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
        
        <!-- Left Tinted Optical Lens with Micro-OLED Projection -->
        <rect x="35" y="75" width="125" height="95" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="3" />
        <circle cx="95" cy="120" r="30" fill="#eab308" opacity="0.35" filter="url(#glow_novaview_xr_glasses_angle)" />
        <rect x="70" y="110" width="50" height="20" rx="4" fill="#eab308" opacity="0.8" />

        <!-- Bridge -->
        <path d="M 160,85 Q 180,75 200,85" fill="none" stroke="#334155" stroke-width="6" />

        <!-- Right Tinted Optical Lens -->
        <rect x="200" y="75" width="125" height="95" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="3" />
        <circle cx="260" cy="120" r="30" fill="#eab308" opacity="0.35" filter="url(#glow_novaview_xr_glasses_angle)" />
        <rect x="235" y="110" width="50" height="20" rx="4" fill="#eab308" opacity="0.8" />

        <!-- Temples Extrusion (Perspective) -->
        <path d="M 25,70 L -15,40" stroke="#334155" stroke-width="8" stroke-linecap="round" />
        <path d="M 335,70 L 375,40" stroke="#334155" stroke-width="8" stroke-linecap="round" />
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">WEARABLES</text>
  </g>
</svg>