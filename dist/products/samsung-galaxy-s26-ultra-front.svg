<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_samsung_galaxy_s26_ultra_front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_samsung_galaxy_s26_ultra_front" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_samsung_galaxy_s26_ultra_front" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_samsung_galaxy_s26_ultra_front" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_samsung_galaxy_s26_ultra_front)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_samsung_galaxy_s26_ultra_front)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_samsung_galaxy_s26_ultra_front)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_samsung_galaxy_s26_ultra_front)">
    
      <g transform="translate(190, 70)">
        <!-- Sleek Bar Phone Front View -->
        <rect x="30" y="10" width="160" height="320" rx="28" fill="#0f172a" stroke="#475569" stroke-width="4" />
        <rect x="34" y="14" width="152" height="312" rx="24" fill="#020617" />
        <!-- Bezel-less Screen Display -->
        <rect x="36" y="16" width="148" height="308" rx="22" fill="#38bdf8" opacity="0.25" />
        <!-- Dynamic Island / Punch Hole -->
        <rect x="90" y="24" width="40" height="12" rx="6" fill="#000000" />
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">SMARTPHONES</text>
  </g>
</svg>