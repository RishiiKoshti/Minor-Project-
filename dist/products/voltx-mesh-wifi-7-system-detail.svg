<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_voltx_mesh_wifi_7_system_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_voltx_mesh_wifi_7_system_detail" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_voltx_mesh_wifi_7_system_detail" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_voltx_mesh_wifi_7_system_detail" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="bulbGrad_voltx_mesh_wifi_7_system_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_voltx_mesh_wifi_7_system_detail)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_voltx_mesh_wifi_7_system_detail)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_voltx_mesh_wifi_7_system_detail)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_voltx_mesh_wifi_7_system_detail)">
    
      <g transform="translate(220, 70)">
        <!-- Minimalist Tower Chassis -->
        <polygon points="40,20 120,20 140,300 20,300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
        <polygon points="42,22 118,22 136,298 24,298" fill="#f1f5f9" />
        
        <!-- Status Indicator Slit (Cyan Glow) -->
        <line x1="80" y1="260" x2="80" y2="280" stroke="#eab308" stroke-width="4" stroke-linecap="round" filter="url(#glow_voltx_mesh_wifi_7_system_detail)" />
        
        <!-- Subtle Top Geometric Bevel -->
        <ellipse cx="80" cy="20" rx="40" ry="8" fill="#e2e8f0" />
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">SMART HOME</text>
  </g>
</svg>