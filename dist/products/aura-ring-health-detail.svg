<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_aura_ring_health_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_aura_ring_health_detail" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_aura_ring_health_detail" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_aura_ring_health_detail" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="ringGrad_aura_ring_health_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_aura_ring_health_detail)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_aura_ring_health_detail)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_aura_ring_health_detail)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_aura_ring_health_detail)">
    
      <g transform="translate(190, 110)">
        <!-- Ring Band in 3/4 Perspective -->
        <ellipse cx="110" cy="130" rx="100" ry="70" fill="none" stroke="#0f172a" stroke-width="32" />
        <ellipse cx="110" cy="130" rx="100" ry="70" fill="none" stroke="#334155" stroke-width="24" />
        <ellipse cx="110" cy="130" rx="100" ry="70" fill="none" stroke="url(#ringGrad_aura_ring_health_detail)" stroke-width="18" />
        
        <!-- Inner Sensor Nodes Glowing Green/Red (PPG Sensors) -->
        <circle cx="70" cy="115" r="5" fill="#22c55e" filter="url(#glow_aura_ring_health_detail)" />
        <circle cx="110" cy="95" r="5" fill="#ef4444" filter="url(#glow_aura_ring_health_detail)" />
        <circle cx="150" cy="115" r="5" fill="#22c55e" filter="url(#glow_aura_ring_health_detail)" />
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">WEARABLES</text>
  </g>
</svg>