<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_cloudedge_smartwatch_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_cloudedge_smartwatch_detail" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_cloudedge_smartwatch_detail" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_cloudedge_smartwatch_detail" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="ringGrad_cloudedge_smartwatch_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_cloudedge_smartwatch_detail)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_cloudedge_smartwatch_detail)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_cloudedge_smartwatch_detail)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_cloudedge_smartwatch_detail)">
    
      <g transform="translate(190, 70)">
        <!-- Strap Loop -->
        <rect x="50" y="0" width="120" height="360" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" />
        

        <!-- Watch Case -->
        <rect x="30" y="100" width="160" height="160" rx="42" fill="#1e293b" stroke="#475569" stroke-width="4" />
        
        <!-- Digital Crown (Right) -->
        <rect x="188" y="130" width="14" height="36" rx="4" fill="#475569" />
        <rect x="188" y="185" width="10" height="30" rx="3" fill="#334155" />
         <!-- Orange Action Button -->

        <!-- OLED Display -->
        <rect x="42" y="112" width="136" height="136" rx="32" fill="#020617" />
        
        <!-- Smart Watchface Dial -->
        <circle cx="110" cy="180" r="52" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-dasharray="240,60" />
        <circle cx="110" cy="180" r="42" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="180,80" />
        <text x="110" y="175" font-family="sans-serif" font-weight="700" font-size="20" fill="#f8fafc" text-anchor="middle">09:41</text>
        <text x="110" y="195" font-family="sans-serif" font-weight="500" font-size="10" fill="#94a3b8" text-anchor="middle">OCT 24</text>
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">WEARABLES</text>
  </g>
</svg>