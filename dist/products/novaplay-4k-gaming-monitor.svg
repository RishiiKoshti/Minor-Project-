<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_novaplay_4k_gaming_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_novaplay_4k_gaming_monitor" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_novaplay_4k_gaming_monitor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_novaplay_4k_gaming_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_novaplay_4k_gaming_monitor)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_novaplay_4k_gaming_monitor)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_novaplay_4k_gaming_monitor)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_novaplay_4k_gaming_monitor)">
    
      <g transform="translate(80, 80)">
        <!-- Curved Bezel-less Display Panel -->
        <rect x="20" y="20" width="400" height="230" rx="12" fill="#0f172a" stroke="#334155" stroke-width="4" />
        <rect x="26" y="26" width="388" height="218" rx="8" fill="#020617" />
        <!-- Screen Content (Cyber Matrix) -->
        <path d="M 26,180 Q 220,100 414,140 L 414,244 L 26,244 Z" fill="#8b5cf6" opacity="0.4" />
        
        <!-- Rear RGB Halo Ambient Glow -->
        <ellipse cx="220" cy="135" rx="120" ry="60" fill="none" stroke="#8b5cf6" stroke-width="4" filter="url(#glow_novaplay_4k_gaming_monitor)" opacity="0.7" />

        <!-- Geometric Stand Stem -->
        <polygon points="205,250 235,250 228,340 212,340" fill="#334155" stroke="#1e293b" stroke-width="2" />
        <!-- Angular Tripod Base Legs -->
        <polygon points="220,335 120,380 140,380 220,345 300,380 320,380" fill="#1e293b" stroke="#475569" stroke-width="2" />
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">GAMING</text>
  </g>
</svg>