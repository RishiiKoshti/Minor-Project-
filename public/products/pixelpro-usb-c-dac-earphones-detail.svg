<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_pixelpro_usb_c_dac_earphones_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_pixelpro_usb_c_dac_earphones_detail" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_pixelpro_usb_c_dac_earphones_detail" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_pixelpro_usb_c_dac_earphones_detail" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="caseGrad_pixelpro_usb_c_dac_earphones_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_pixelpro_usb_c_dac_earphones_detail)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_pixelpro_usb_c_dac_earphones_detail)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_pixelpro_usb_c_dac_earphones_detail)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_pixelpro_usb_c_dac_earphones_detail)">
    
      <g transform="translate(180, 80)">
        <!-- Left & Right IEM Earphone Shells -->
        <g transform="translate(40, 80)">
          <path d="M 0,20 C 0,0 40,0 40,20 C 40,40 20,50 0,40 Z" fill="#0f172a" stroke="#22c55e" stroke-width="3" />
          <circle cx="20" cy="20" r="10" fill="#1e293b" />
          <circle cx="20" cy="20" r="4" fill="#22c55e" />
          <!-- Silicone Tip -->
          <ellipse cx="45" cy="20" rx="8" ry="12" fill="#334155" />
        </g>
        <g transform="translate(160, 80)">
          <path d="M 40,20 C 40,0 0,0 0,20 C 0,40 20,50 40,40 Z" fill="#0f172a" stroke="#22c55e" stroke-width="3" />
          <circle cx="20" cy="20" r="10" fill="#1e293b" />
          <circle cx="20" cy="20" r="4" fill="#22c55e" />
          <!-- Silicone Tip -->
          <ellipse cx="-5" cy="20" rx="8" ry="12" fill="#334155" />
        </g>

        <!-- Braided Silver Cables -->
        <path d="M 50,125 C 50,180 110,180 120,220" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,2" />
        <path d="M 190,125 C 190,180 130,180 120,220" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,2" />
        
        <!-- Y-Splitter & Inline Mic / DAC -->
        <rect x="112" y="220" width="16" height="30" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5" />
        
        <!-- Main Braided Cable to USB-C Plug -->
        <line x1="120" y1="250" x2="120" y2="330" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="5,2" />
        
        <!-- Premium Aluminum USB-C DAC Connector -->
        <rect x="110" y="330" width="20" height="40" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="2" />
        <rect x="114" y="370" width="12" height="18" rx="2" fill="#cbd5e1" />
        <circle cx="120" cy="350" r="3" fill="#22c55e" filter="url(#glow_pixelpro_usb_c_dac_earphones_detail)" />
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">HEADPHONES</text>
  </g>
</svg>