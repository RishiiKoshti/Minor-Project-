<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_apexbook_14_pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_apexbook_14_pro" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_apexbook_14_pro" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_apexbook_14_pro" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="screenGrad_apexbook_14_pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_apexbook_14_pro)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_apexbook_14_pro)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_apexbook_14_pro)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_apexbook_14_pro)">
    
      <!-- Display Lid -->
      <g transform="translate(140, 75)">
        <rect x="0" y="0" width="320" height="200" rx="10" fill="#cbd5e1" stroke="#334155" stroke-width="3" />
        <!-- Screen Bezel & Display Panel -->
        <rect x="10" y="10" width="300" height="180" rx="4" fill="#090d16" />
        <!-- Vibrant Display Wallpaper -->
        <rect x="12" y="12" width="296" height="176" rx="3" fill="url(#screenGrad_apexbook_14_pro)" />
        <!-- Screen Wave Lines -->
        <path d="M 12,140 Q 90,80 160,110 T 308,60 L 308,188 L 12,188 Z" fill="#38bdf8" opacity="0.35" />
        <path d="M 12,160 Q 110,100 200,140 T 308,100 L 308,188 L 12,188 Z" fill="#38bdf8" opacity="0.5" />
        <!-- Webcam Notch -->
        <circle cx="160" cy="6" r="2.5" fill="#000000" />
        <circle cx="160" cy="6" r="1" fill="#38bdf8" />
      </g>

      <!-- Hinge -->
      <rect x="180" y="272" width="240" height="8" rx="3" fill="#475569" />

      <!-- Keyboard Base Deck (Perspective Trapeze) -->
      <g transform="translate(80, 275)">
        <polygon points="60,0 380,0 440,110 0,110" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
        <polygon points="62,2 378,2 436,108 4,108" fill="#1e293b" />
        
        <!-- Keyboard Well -->
        <polygon points="90,10 350,10 375,65 65,65" fill="#0f172a" />
        
        <!-- Key Rows Simulated (Backlit) -->
        <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" fill="none">
          <line x1="95" y1="20" x2="345" y2="20" stroke-dasharray="14,4" />
          <line x1="90" y1="32" x2="350" y2="32" stroke-dasharray="14,4" />
          <line x1="85" y1="44" x2="355" y2="44" stroke-dasharray="14,4" />
          <line x1="80" y1="56" x2="360" y2="56" stroke-dasharray="14,4" />
        </g>

        <!-- Trackpad -->
        <rect x="180" y="72" width="80" height="32" rx="4" fill="#334155" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
        
        
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">LAPTOPS</text>
  </g>
</svg>