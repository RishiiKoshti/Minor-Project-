<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_vivo_x300_pro_camera" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_vivo_x300_pro_camera" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_vivo_x300_pro_camera" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_vivo_x300_pro_camera" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_vivo_x300_pro_camera)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_vivo_x300_pro_camera)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_vivo_x300_pro_camera)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_vivo_x300_pro_camera)">
    
      <g transform="translate(160, 90)">
        <!-- Back Ceramic/Titanium Plate -->
        <rect x="0" y="0" width="280" height="280" rx="32" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
        
        <!-- Large Camera Island Plate -->
        <rect x="25" y="25" width="230" height="230" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2" />
        
        <!-- Primary 200MP Lens Element -->
        <circle cx="85" cy="85" r="42" fill="#020617" stroke="#38bdf8" stroke-width="3" />
        <circle cx="85" cy="85" r="28" fill="#0f172a" />
        <circle cx="80" cy="80" r="12" fill="#38bdf8" opacity="0.6" filter="url(#glow_vivo_x300_pro_camera)" />

        <!-- Periscope Telephoto Lens -->
        <rect x="45" y="145" width="80" height="65" rx="14" fill="#020617" stroke="#475569" stroke-width="2" />
        <rect x="60" y="160" width="50" height="35" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />

        <!-- Ultra-wide Lens -->
        <circle cx="185" cy="85" r="32" fill="#020617" stroke="#475569" stroke-width="2" />
        <circle cx="185" cy="85" r="18" fill="#0f172a" />

        <!-- Depth Sensor & LED Flash -->
        <circle cx="185" cy="155" r="14" fill="#f8fafc" filter="url(#glow_vivo_x300_pro_camera)" />
        <text x="185" y="205" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">200MP OIS</text>
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">SMARTPHONES</text>
  </g>
</svg>