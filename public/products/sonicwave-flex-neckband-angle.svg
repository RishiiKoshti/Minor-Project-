<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_sonicwave_flex_neckband_angle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_sonicwave_flex_neckband_angle" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_sonicwave_flex_neckband_angle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_sonicwave_flex_neckband_angle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="caseGrad_sonicwave_flex_neckband_angle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_sonicwave_flex_neckband_angle)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_sonicwave_flex_neckband_angle)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_sonicwave_flex_neckband_angle)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_sonicwave_flex_neckband_angle)">
    
      <g transform="translate(160, 90)">
        <!-- Flexible Silicone Neck Collar -->
        <path d="M 40,240 C 20,80 260,80 240,240" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round" />
        <path d="M 40,240 C 20,80 260,80 240,240" fill="none" stroke="#ec4899" stroke-width="3" stroke-opacity="0.8" />
        
        <!-- Left Weighted Module & Controls -->
        <rect x="26" y="210" width="28" height="70" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2" />
        <circle cx="40" cy="235" r="4" fill="#ec4899" />
        <line x1="34" y1="255" x2="46" y2="255" stroke="#94a3b8" stroke-width="2" />

        <!-- Right Weighted Module & Battery -->
        <rect x="226" y="210" width="28" height="70" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2" />
        
        <!-- Earbud Leads -->
        <path d="M 40,280 C 40,320 80,310 100,280" fill="none" stroke="#475569" stroke-width="3" />
        <path d="M 240,280 C 240,320 200,310 180,280" fill="none" stroke="#475569" stroke-width="3" />
        
        <!-- Magnetic Joined Earbuds -->
        <g transform="translate(130, 260)">
          <rect x="-15" y="0" width="14" height="28" rx="6" fill="#334155" stroke="#ec4899" stroke-width="2" />
          <rect x="1" y="0" width="14" height="28" rx="6" fill="#334155" stroke="#ec4899" stroke-width="2" />
          <circle cx="-1" cy="14" r="3" fill="#38bdf8" />
        </g>
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">HEADPHONES</text>
  </g>
</svg>