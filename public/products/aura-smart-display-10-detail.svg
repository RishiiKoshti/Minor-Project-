<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_aura_smart_display_10_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_aura_smart_display_10_detail" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_aura_smart_display_10_detail" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_aura_smart_display_10_detail" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="bulbGrad_aura_smart_display_10_detail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_aura_smart_display_10_detail)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_aura_smart_display_10_detail)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_aura_smart_display_10_detail)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_aura_smart_display_10_detail)">
    
      <g transform="translate(130, 90)">
        <!-- Angled Fabric Speaker Base -->
        <polygon points="60,240 280,240 320,300 20,300" fill="#1e293b" stroke="#334155" stroke-width="2" />

        <!-- 10-Inch Touchscreen Panel -->
        <rect x="30" y="30" width="280" height="190" rx="14" fill="#0f172a" stroke="#475569" stroke-width="4" />
        <rect x="38" y="38" width="264" height="174" rx="8" fill="#020617" />
        
        <!-- Screen Content (Clock + Weather Widget) -->
        <text x="70" y="90" font-family="sans-serif" font-weight="700" font-size="32" fill="#f8fafc">12:30</text>
        <text x="70" y="115" font-family="sans-serif" font-size="12" fill="#94a3b8">26° Sunny · Ahmedabad</text>
        
        <!-- Smart Home Quick Toggles -->
        <rect x="70" y="135" width="85" height="50" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
        <text x="112" y="165" font-family="sans-serif" font-size="11" fill="#eab308" text-anchor="middle">💡 Living Room</text>
        <rect x="165" y="135" width="85" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="207" y="165" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">🔒 Security ON</text>
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">SMART HOME</text>
  </g>
</svg>