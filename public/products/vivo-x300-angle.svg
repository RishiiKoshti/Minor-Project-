<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_vivo_x300_angle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_vivo_x300_angle" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_vivo_x300_angle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_vivo_x300_angle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_vivo_x300_angle)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_vivo_x300_angle)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_vivo_x300_angle)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_vivo_x300_angle)">
    
      <g transform="translate(190, 80)">
        <polygon points="50,20 180,60 140,320 10,280" fill="#0f172a" stroke="#334155" stroke-width="3" />
        <polygon points="54,24 176,62 136,316 14,278" fill="#020617" />
        <!-- Screen Glow -->
        <polygon points="60,35 170,70 132,310 22,275" fill="#38bdf8" opacity="0.3" filter="url(#glow_vivo_x300_angle)" />
        <text x="95" y="180" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle" transform="rotate(18, 95, 180)">vivo X300</text>
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">SMARTPHONES</text>
  </g>
</svg>