<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_novabook_flex_2in1_angle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_novabook_flex_2in1_angle" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_novabook_flex_2in1_angle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_novabook_flex_2in1_angle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="screenGrad_novabook_flex_2in1_angle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_novabook_flex_2in1_angle)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_novabook_flex_2in1_angle)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_novabook_flex_2in1_angle)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_novabook_flex_2in1_angle)">
    
      <!-- Tent Mode Hinged Chassis -->
      <polygon points="300,100 460,370 410,380 300,160 190,380 140,370" fill="#1e293b" stroke="#475569" stroke-width="3" />
      <!-- Left Screen Pane (OLED display) -->
      <polygon points="295,110 155,360 215,360 305,170" fill="#0f172a" />
      <!-- Screen Wallpaper Glow -->
      <polygon points="290,125 170,350 210,350 295,175" fill="#f59e0b" opacity="0.85" />
      <!-- Digital Stylus Pen resting beside -->
      <g transform="translate(420, 260) rotate(-45)">
        <rect x="0" y="0" width="12" height="150" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
        <polygon points="0,150 12,150 6,170" fill="#0f172a" />
        <line x1="6" y1="20" x2="6" y2="60" stroke="#f59e0b" stroke-width="2" />
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">LAPTOPS</text>
  </g>
</svg>