<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg_voltx_wireless_buds_pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <radialGradient id="studioSpot_voltx_wireless_buds_pro" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_voltx_wireless_buds_pro" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow_voltx_wireless_buds_pro" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="caseGrad_voltx_wireless_buds_pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="600" height="500" fill="url(#studioBg_voltx_wireless_buds_pro)" rx="16" />
  <ellipse cx="300" cy="240" rx="270" ry="200" fill="url(#studioSpot_voltx_wireless_buds_pro)" />
  
  <!-- Studio Pedestal Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="24" fill="#000000" opacity="0.6" filter="url(#glow_voltx_wireless_buds_pro)" />

  <!-- Device Artwork -->
  <g filter="url(#shadow_voltx_wireless_buds_pro)">
    
      <g transform="translate(190, 110)">
        <!-- Charging Case Body -->
        <rect x="20" y="100" width="180" height="150" rx="40" fill="#0f172a" stroke="#334155" stroke-width="4" />
        <rect x="25" y="105" width="170" height="140" rx="35" fill="url(#caseGrad_voltx_wireless_buds_pro)" />
        
        <!-- LED Battery Indicator Dots -->
        <circle cx="95" cy="210" r="3" fill="#38bdf8" filter="url(#glow_voltx_wireless_buds_pro)" />
        <circle cx="110" cy="210" r="3" fill="#38bdf8" filter="url(#glow_voltx_wireless_buds_pro)" />
        <circle cx="125" cy="210" r="3" fill="#38bdf8" filter="url(#glow_voltx_wireless_buds_pro)" />

        <!-- Interior Charging Well -->
        <ellipse cx="110" cy="115" rx="75" ry="30" fill="#070a11" stroke="#1e293b" stroke-width="2" />

        <!-- Left Earbud (Stem + Pod) -->
        <g transform="translate(55, 30)">
          <!-- Contoured Head -->
          <ellipse cx="20" cy="35" rx="18" ry="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
          <ellipse cx="14" cy="35" rx="8" ry="14" fill="#334155" />
          <!-- Stem -->
          <rect x="16" y="45" width="12" height="60" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
          <circle cx="22" cy="65" r="3" fill="#38bdf8" />
        </g>

        <!-- Right Earbud (Stem + Pod) -->
        <g transform="translate(125, 30)">
          <!-- Contoured Head -->
          <ellipse cx="20" cy="35" rx="18" ry="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
          <ellipse cx="26" cy="35" rx="8" ry="14" fill="#334155" />
          <!-- Stem -->
          <rect x="12" y="45" width="12" height="60" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
          <circle cx="18" cy="65" r="3" fill="#38bdf8" />
        </g>
      </g>
    
  </g>

  <!-- Watermark subtle branding -->
  <g opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="32" y="476" letter-spacing="1">ELECTROHAVEN</text>
    <text x="568" y="476" text-anchor="end" letter-spacing="0.5">HEADPHONES</text>
  </g>
</svg>